[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-vc-landscape"
version = "0.1.0"
description = "Git-native semiconductor and AI infrastructure venture intelligence database"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["semivc*"]

