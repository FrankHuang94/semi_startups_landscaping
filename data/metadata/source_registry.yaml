  academic_paper: Publisher, proceedings, DOI, or recognized preprint repository.
  news: Reputable financial or technology press.
  analyst: Attributed analyst research.
  database: Structured third-party database.
  interview: Direct attributed interview.
  estimate: Explicitly labeled estimate with methodology.
